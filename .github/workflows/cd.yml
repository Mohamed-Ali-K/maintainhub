name: CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      run: ./gradlew build -x test
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
        SERVER_PORT: ${{ secrets.SERVER_PORT }}
        SPRING_PROFILES_ACTIVE: prod
        LOG_LEVEL: INFO

    - name: Build Docker image
      run: docker build -t maintainhub-cmms:${{ github.sha }} .

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker image
      run: |
        docker tag maintainhub-cmms:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/maintainhub-cmms:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/maintainhub-cmms:latest

    - name: Deploy to production
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
      run: |
        # Install SSH key
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts

        # Deploy using SSH
        ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST << 'ENDSSH'
          # Pull latest image
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/maintainhub-cmms:latest

          # Stop and remove existing container
          docker stop maintainhub-cmms || true
          docker rm maintainhub-cmms || true

          # Run new container
          docker run -d \
            --name maintainhub-cmms \
            --restart unless-stopped \
            -p 8080:8080 \
            -e DB_HOST=${{ secrets.DB_HOST }} \
            -e DB_PORT=${{ secrets.DB_PORT }} \
            -e DB_NAME=${{ secrets.DB_NAME }} \
            -e DB_USER=${{ secrets.DB_USER }} \
            -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
            -e JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION }} \
            -e SERVER_PORT=${{ secrets.SERVER_PORT }} \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e LOG_LEVEL=INFO \
            ${{ secrets.DOCKERHUB_USERNAME }}/maintainhub-cmms:latest

          # Wait for health check
          echo "Waiting for application to be healthy..."
          sleep 30

          # Check container health
          if docker ps | grep -q "maintainhub-cmms.*healthy"; then
            echo "Deployment successful!"
          else
            echo "Deployment failed - container is not healthy"
            docker logs maintainhub-cmms
            exit 1
          fi
        ENDSSH 